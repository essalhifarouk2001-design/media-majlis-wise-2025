<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Television | Media Majlis Museum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        
        .logo {
            max-width: 280px;
            height: auto;
            margin: 0 auto 1.5rem;
            display: block;
        }
        
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            line-height: 1.3;
        }
        
        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        
        .content-section {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .content-section:last-of-type {
            border-bottom: none;
        }
        
        .language-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #3b82f6;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }
        
        .language-label.arabic {
            background: #8b1538;
        }
        
        .content-section p {
            margin-bottom: 1rem;
            font-size: 1rem;
            line-height: 1.8;
            color: #4b5563;
        }
        
        .content-section p:last-child {
            margin-bottom: 0;
        }
        
        .arabic-content {
            direction: rtl;
            text-align: right;
            font-family: 'Traditional Arabic', 'Arial', sans-serif;
        }
        
        .website-button {
            display: inline-block;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 1rem;
        }
        
        .website-button:hover
